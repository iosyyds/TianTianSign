name: TianTianSign
options:
  bundleIdPrefix: com.tiantiansign
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

targets:
  TianTianSign:
    type: application
    platform: iOS
    sources:
      - path: TianTianSign
        excludes:
          - "Info.plist"
      - path: SigningCore
    info:
      path: TianTianSign/Info.plist
      properties:
        CFBundleName: 甜甜签
        CFBundleDisplayName: 甜甜签
        CFBundleIdentifier: com.tiantiansign.app
        CFBundleVersion: "8"
        CFBundleShortVersionString: "0.1.6"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSDocumentsFolderUsageDescription: 甜甜签需要访问「文件」App 来导入你自己的 IPA、证书 (.p12) 和描述文件 (.mobileprovision)。
        CFBundleDocumentTypes:
          - CFBundleTypeName: "IPA 安装包"
            CFBundleTypeExtensions: ["ipa"]
            CFBundleTypeRole: "Viewer"
          - CFBundleTypeName: "P12 证书"
            CFBundleTypeExtensions: ["p12"]
            CFBundleTypeRole: "Viewer"
          - CFBundleTypeName: "描述文件"
            CFBundleTypeExtensions: ["mobileprovision", "mobileproportion"]
            CFBundleTypeRole: "Viewer"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiantiansign.app
        MARKETING_VERSION: 0.1.6
        CURRENT_PROJECT_VERSION: "8"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SWIFT_OBJC_BRIDGING_HEADER: TianTianSign/TianTianSign-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/SigningCore"
          - "$(SRCROOT)/SigningCore/common"
          - "$(SRCROOT)/SigningCore/third-party/minizip"
          - "$(SRCROOT)/SigningCore/third-party/zlib"
          - "$(PODS_ROOT)/OpenSSL-Universal/include"
        FRAMEWORK_SEARCH_PATHS:
          - "$(PODS_ROOT)/OpenSSL-Universal"
        OTHER_LDFLAGS:
          - "-lc++"
          - "-lz"
          - "-framework OpenSSL"
          - "-framework Security"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
