name: TianTianSign
options:
  bundleIdPrefix: com.tiantiansign
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

targets:
  TianTianSign:
    type: application
    platform: iOS
    sources:
      - path: TianTianSign
        excludes:
          - "Info.plist"
      - path: SigningCore
    info:
      path: TianTianSign/Info.plist
      properties:
        CFBundleName: 甜甜签
        CFBundleDisplayName: 甜甜签
        CFBundleIdentifier: com.tiantiansign.app
        CFBundleVersion: "6"
        CFBundleShortVersionString: "0.1.5"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSDocumentsFolderUsageDescription: 甜甜签需要访问「文件」App 来导入你自己的 IPA、证书 (.p12) 和描述文件 (.mobileprovision)。
        CFBundleDocumentTypes:
          - CFBundleTypeName: iOS Package Archive
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.tiantiansign.app.ipa
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.tiantiansign.app.ipa
            UTTypeDescription: iOS Package Archive
            UTTypeConformsTo:
              - public.data
              - public.content
            UTTypeTagSpecification:
              public.filename-extension:
                - ipa
              public.mime-type:
                - application/octet-stream
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiantiansign.app
        MARKETING_VERSION: 0.1.5
        CURRENT_PROJECT_VERSION: "6"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SWIFT_OBJC_BRIDGING_HEADER: TianTianSign/TianTianSign-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/SigningCore"
          - "$(SRCROOT)/SigningCore/common"
          - "$(SRCROOT)/SigningCore/third-party/minizip"
          - "$(SRCROOT)/SigningCore/third-party/zlib"
          - "$(PODS_ROOT)/OpenSSL-Universal/include"
        FRAMEWORK_SEARCH_PATHS:
          - "$(PODS_ROOT)/OpenSSL-Universal"
        OTHER_LDFLAGS:
          - "-lc++"
          - "-lz"
          - "-framework OpenSSL"
          - "-framework Security"
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
