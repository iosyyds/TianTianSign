name: Build Unsigned IPA

on:
  push:
    branches: [main]
    paths:
      - "TianTianSign/**"
      - "project.yml"
      - "Podfile"
      - ".github/workflows/build-ipa.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_*.app | tail -1)
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install tools
        run: |
          brew install xcodegen || brew upgrade xcodegen || true
          brew install cocoapods || brew upgrade cocoapods || true

      - name: Vendor zsign engine
        run: |
          set -e
          git clone --depth 1 https://github.com/zhlynn/zsign.git /tmp/zsign
          mkdir -p SigningCore
          cp -R /tmp/zsign/src/* SigningCore/
          sed -i '' 's/^int main(int argc, char\* argv\[\])/extern "C" int zsign_main(int argc, char* argv[])/' SigningCore/zsign.cpp
          cat > SigningCore/ios_bridge.cpp << 'BRIDGE'
          #include <string>
          #include <vector>
          extern "C" int zsign_main(int argc, char* argv[]);
          extern "C" int zsign_ios_run(int argc, const char** argv) {
              std::vector<char*> args;
              for (int i = 0; i < argc; i++) args.push_back((char*)argv[i]);
              return zsign_main(argc, args.data());
          }
          BRIDGE
          rm -f SigningCore/third-party/minizip/iowin32.c

      - name: Generate Xcode project & install pods
        run: |
          xcodegen generate
          pod install --repo-update

      - name: Build .xcarchive (unsigned)
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace TianTianSign.xcworkspace \
            -scheme TianTianSign \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TianTianSign.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" 2>&1 | tee build.log
          echo "----- last 100 lines of build.log -----"
          tail -n 100 build.log

      - name: Pack unsigned IPA
        if: always()
        run: |
          set +e
          if [ -d "build/TianTianSign.xcarchive/Products/Applications" ]; then
            mkdir -p build/Payload
            cp -R build/TianTianSign.xcarchive/Products/Applications/TianTianSign.app build/Payload/
            cd build
            zip -r TianTianSign-unsigned-v0.1.0.ipa Payload
            ls -la TianTianSign-unsigned-v0.1.0.ipa
          fi

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TianTianSign-unsigned-ipa
          path: build/TianTianSign-unsigned-v0.1.0.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 14
