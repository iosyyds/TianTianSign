name: Build Unsigned IPA

on:
  push:
    branches: [main]
    paths:
      - "TianTianSign/**"
      - "project.yml"
      - ".github/workflows/build-ipa.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_*.app | tail -1)
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen || brew upgrade xcodegen || true

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la
          xcodebuild -list -project TianTianSign.xcodeproj || true

      - name: Build .xcarchive (unsigned)
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild archive \
            -project TianTianSign.xcodeproj \
            -scheme TianTianSign \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TianTianSign.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" 2>&1 | tee build.log
          echo "----- last 120 lines of build.log -----"
          tail -n 120 build.log

      - name: Pack unsigned IPA
        if: always()
        continue-on-error: true
        run: |
          ls build/ || true
          if [ -d "build/TianTianSign.xcarchive/Products/Applications" ]; then
            mkdir -p build/Payload
            cp -R build/TianTianSign.xcarchive/Products/Applications/TianTianSign.app build/Payload/
            cd build
            zip -r TianTianSign-unsigned-v0.1.0.ipa Payload
            ls -la TianTianSign-unsigned-v0.1.0.ipa
          fi

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TianTianSign-unsigned-ipa
          path: build/TianTianSign-unsigned-v0.1.0.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            build/
          if-no-files-found: warn
          retention-days: 14
