name: Build TianTianSign IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install Pillow

      - name: Install xcpretty
        run: sudo gem install xcpretty

      - name: Generate App Icon
        run: |
          set -e
          ICON_DIR="TianTianSign/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import os
          size = 1024
          img = Image.new('RGB', (size, size), '#0A84FF')
          d = ImageDraw.Draw(img)
          try:
              font = ImageFont.truetype('/System/Library/Fonts/SFPro-Bold.otf', 420)
          except Exception:
              font = ImageFont.load_default()
          text = '签'
          bbox = d.textbbox((0,0), text, font=font)
          tw, th = bbox[2]-bbox[0], bbox[3]-bbox[1]
          d.text(((size-tw)/2 - bbox[0], (size-th)/2 - bbox[1]), text, fill='white', font=font)
          out = os.path.join('TianTianSign/Assets.xcassets/AppIcon.appiconset', 'icon-1024.png')
          img.save(out, 'PNG')
          print('Saved', out, os.path.getsize(out))
          PY
          ls -la "$ICON_DIR"

      - name: Write Contents.json
        run: |
          cat > TianTianSign/Assets.xcassets/AppIcon.appiconset/Contents.json <<'JSON'
          {
            "images" : [
              { "filename" : "icon-1024.png", "idiom" : "ios-marketing", "scale" : "1x" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Clone zsign
        run: git clone --depth 1 https://github.com/zhlynn/zsign.git SigningCore/zsign

      - name: Bump version
        run: |
          if [ -f project.yml ]; then
            sed -i '' 's/0\.1\.[0-9]*/0.1.7/g' project.yml || true
          fi
          cat project.yml | grep -i version || true

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install CocoaPods
        run: pod install

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace TianTianSign.xcworkspace \
            -scheme TianTianSign \
            -configuration Release \
            -archivePath build/TianTianSign.xcarchive \
            CODE_SIGNING_ALLOWED=NO | xcpretty

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/TianTianSign.xcarchive/Products/Applications/TianTianSign.app build/Payload/
          cd build && zip -r TianTianSign-0.1.7.ipa Payload
          ls -la TianTianSign-0.1.7.ipa

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.7
          name: TianTianSign 0.1.7
          files: build/TianTianSign-0.1.7.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
