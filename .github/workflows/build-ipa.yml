name: Build Unsigned IPA

on:
  push:
    branches: [main]
    paths:
      - "TianTianSign/**"
      - "project.yml"
      - "Podfile"
      - ".github/workflows/build-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_*.app | tail -1)
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install tools
        run: |
          brew install xcodegen || true
          brew install cocoapods || true

      - name: Vendor zsign engine
        run: |
          set -e
          git clone --depth 1 https://github.com/zhlynn/zsign.git /tmp/zsign
          mkdir -p SigningCore
          cp -R /tmp/zsign/src/* SigningCore/
          sed -i '' 's/^int main(int argc, char\* argv\[\])/extern "C" int zsign_main(int argc, char* argv[])/' SigningCore/zsign.cpp
          cat > SigningCore/ios_bridge.cpp << 'BRIDGE'
          #include <string>
          #include <vector>
          extern "C" int zsign_main(int argc, char* argv[]);
          extern "C" int zsign_ios_run(int argc, const char** argv) {
              std::vector<char*> args;
              for (int i = 0; i < argc; i++) args.push_back((char*)argv[i]);
              return zsign_main(argc, args.data());
          }
          BRIDGE
          rm -f SigningCore/third-party/minizip/iowin32.c

      - name: Generate Xcode project & install pods
        run: |
          xcodegen generate
          pod install --repo-update
          OSSL_HEADERS=$(find Pods/OpenSSL-Universal -type d -name Headers | head -1)
          echo "OpenSSL headers at: $OSSL_HEADERS"
          mkdir -p Pods/OpenSSL-Universal/include
          ln -sf "$PWD/$OSSL_HEADERS" Pods/OpenSSL-Universal/include/openssl
          OSSL_FW_DIR=$(find Pods/OpenSSL-Universal -type d -path "*ios-arm64*/OpenSSL.framework" -exec dirname {} \; | head -1)
          echo "OpenSSL iOS framework dir: $OSSL_FW_DIR"
          echo "OSSL_FW_DIR=$PWD/$OSSL_FW_DIR" >> $GITHUB_ENV

      - name: Build .xcarchive (unsigned)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace TianTianSign.xcworkspace \
            -scheme TianTianSign \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TianTianSign.xcarchive \
            FRAMEWORK_SEARCH_PATHS="$OSSL_FW_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" 2>&1 | tee build.log

      - name: Report error as issue
        if: steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build.log', 'utf8'); } catch(e) {}
            const errLines = log.split('\n').filter(l => /error:|fatal error|Undefined symbol|ld: |linker command failed/i.test(l));
            const tail = log.split('\n').slice(-40).join('\n');
            const body = '## Build error\n\n```\n' + (errLines.join('\n') || '(no error lines matched)') + '\n```\n\n## Tail\n\n```\n' + tail + '\n```';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'CI build error - ' + new Date().toISOString(),
              body: body.slice(0, 60000),
              labels: ['bug']
            });

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Pack unsigned IPA
        if: always()
        run: |
          set +e
          if [ -d "build/TianTianSign.xcarchive/Products/Applications" ]; then
            mkdir -p build/Payload
            cp -R build/TianTianSign.xcarchive/Products/Applications/TianTianSign.app build/Payload/
            cd build
            zip -r TianTianSign-unsigned-v0.1.0.ipa Payload
          fi

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TianTianSign-unsigned-ipa
          path: build/TianTianSign-unsigned-v0.1.0.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 14
