name: Build Unsigned IPA

on:
  push:
    branches: [main]
    paths:
      - "TianTianSign/**"
      - "project.yml"
      - ".github/workflows/build-ipa.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show project
        run: ls -la && xcodebuild -list -project TianTianSign.xcodeproj

      - name: Build .xcarchive (unsigned)
        run: |
          set -e
          xcodebuild archive \
            -project TianTianSign.xcodeproj \
            -scheme TianTianSign \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TianTianSign.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Pack unsigned IPA
        run: |
          set -e
          mkdir -p build/Payload
          cp -R build/TianTianSign.xcarchive/Products/Applications/TianTianSign.app build/Payload/
          cd build
          zip -r TianTianSign-unsigned-v0.1.0.ipa Payload
          ls -la TianTianSign-unsigned-v0.1.0.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TianTianSign-unsigned-ipa
          path: build/TianTianSign-unsigned-v0.1.0.ipa
          if-no-files-found: error
          retention-days: 14
